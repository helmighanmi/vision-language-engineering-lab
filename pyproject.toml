# Path: pyproject.toml
# Author: GHANMI Helmi
# Current Role: AI Engineer
# Past Role: Researcher in Applied Mathematics
# Research Profile: https://www.researchgate.net/profile/Ghanmi-Helmi

[build-system]
requires = [
  "setuptools>=83",
  "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "vision-language-engineering-lab"
version = "0.1.0"
description = "Production-oriented Vision-Language engineering with CLIP, Qwen3-VL, visual document understanding and multimodal RAG."
readme = "README.md"

requires-python = ">=3.12,<3.13"

license = "Apache-2.0"

authors = [
  { name = "GHANMI Helmi" },
]

keywords = [
  "vision-language-model",
  "vlm",
  "multimodal-ai",
  "clip",
  "qwen3-vl",
  "multimodal-rag",
  "visual-rag",
  "document-ai",
  "image-retrieval",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.26,<3",
  "pillow>=12.3,<13",
]


[project.urls]
Homepage = "https://github.com/helmighanmi/vision-language-engineering-lab"
Repository = "https://github.com/helmighanmi/vision-language-engineering-lab"
Issues = "https://github.com/helmighanmi/vision-language-engineering-lab/issues"
Documentation = "https://github.com/helmighanmi/vision-language-engineering-lab/tree/main/docs"


[project.optional-dependencies]

clip = [
  "torch>=2.8,<3",
  "transformers>=4.57,<6",
]

qwen = [
  "accelerate>=1.10,<2",
  "huggingface-hub>=0.34,<2",
  "qwen-vl-utils>=0.0.14,<1",
  "torch>=2.8,<3",
  "transformers>=4.57,<6",
]

retrieval = [
  "sentence-transformers>=5.4,<6",
]

notebooks = [
  "jupyterlab>=4,<5",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<3",
]

dev = [
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.12,<1",
]

all = [
  "accelerate>=1.10,<2",
  "huggingface-hub>=0.34,<2",
  "qwen-vl-utils>=0.0.14,<1",
  "sentence-transformers>=5.4,<6",
  "torch>=2.8,<3",
  "transformers>=4.57,<6",
]


[project.scripts]
vlm-lab = "vlm_engineering.cli:main"


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = [
  "tests",
]
addopts = "-ra -q"


[tool.ruff]
target-version = "py312"
line-length = 110

extend-exclude = [
  ".venv",
  "build",
  "dist",
  "legacy",
  "notebooks",
]


[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "B",
  "I",
]


[tool.mypy]
python_version = "3.12"

check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
warn_unused_configs = true

packages = [
  "vlm_engineering",
]


[tool.coverage.run]
source = [
  "vlm_engineering",
]
branch = true


[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
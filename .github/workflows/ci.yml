name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "docs/**"

  pull_request:
    branches:
      - main


jobs:
  quality:
    name: Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Show Python version
        run: |
          python --version
          python -m pip --version

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install lightweight deterministic test dependencies
        run: |
          python -m pip install -e ".[dev,config,service]"

      - name: Check dependency consistency
        run: |
          python -m pip check

      - name: Smoke test public package imports
        run: |
          python - <<'PY'
          from vlm_engineering import (
              CLIPEncoder,
              QwenVLModel,
              QwenVLEmbedder,
              QwenVLReranker,
              MultimodalRAGPipeline,
              VisualRAGPipeline,
          )
          from vlm_engineering.retrieval import TextEmbedder

          print(QwenVLEmbedder.__name__, QwenVLReranker.__name__, MultimodalRAGPipeline.__name__)
          print("CLIPEncoder:", CLIPEncoder.__name__)
          print("QwenVLModel:", QwenVLModel.__name__)
          print("VisualRAGPipeline:", VisualRAGPipeline.__name__)
          print("TextEmbedder:", TextEmbedder.__name__)
          print("Public API imports OK")
          PY

      - name: Ruff
        run: |
          python -m ruff check .

      - name: Mypy
        run: |
          python -m mypy .

      - name: Tests with coverage
        run: |
          python -m pytest \
            -m "not real_model" \
            --cov=vlm_engineering \
            --cov-report=term-missing

      - name: Dependency security audit
        run: |
          python -m pip_audit .

  build-wheel:
    name: Build and install wheel

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: |
          python -m build

      - name: Validate distributions
        run: |
          python -m twine check dist/*

      - name: Check the wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "vlm_engineering/py.typed" in names
          assert "vlm_engineering/service/app.py" in names
          assert "vlm_engineering/cli.py" in names
          print(f"{wheel}: {len(names)} entries")
          PY

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          /tmp/wheel-venv/bin/python -m pip install "${WHEEL}[service]"
          /tmp/wheel-venv/bin/python -m pip install "pytest>=9,<10"
          /tmp/wheel-venv/bin/python -m pip check

      - name: Run contract tests against the installed wheel
        env:
          PYTHONPATH: ""
        run: |
          /tmp/wheel-venv/bin/python -m pytest tests/contract
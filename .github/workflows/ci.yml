name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "refactor/**"

  pull_request:
    branches:
      - main


jobs:
  quality:
    name: Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Show Python version
        run: |
          python --version
          python -m pip --version

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install package with all runtime and development dependencies
        run: |
          python -m pip install -e ".[all,dev]"

      - name: Check dependency consistency
        run: |
          python -m pip check

      - name: Show resolved AI dependency versions
        run: |
          python - <<'PY'
          import sys

          import accelerate
          import huggingface_hub
          import numpy
          import sentence_transformers
          import torch
          import transformers

          print("Python:", sys.version)
          print("NumPy:", numpy.__version__)
          print("PyTorch:", torch.__version__)
          print("Transformers:", transformers.__version__)
          print("Sentence Transformers:", sentence_transformers.__version__)
          print("Accelerate:", accelerate.__version__)
          print("Hugging Face Hub:", huggingface_hub.__version__)
          PY

      - name: Smoke test public package imports
        run: |
          python - <<'PY'
          from vlm_engineering import (
              CLIPEncoder,
              QwenVLModel,
              VisualRAGPipeline,
          )
          from vlm_engineering.retrieval import TextEmbedder

          print("CLIPEncoder:", CLIPEncoder.__name__)
          print("QwenVLModel:", QwenVLModel.__name__)
          print("VisualRAGPipeline:", VisualRAGPipeline.__name__)
          print("TextEmbedder:", TextEmbedder.__name__)
          print("Public API imports OK")
          PY

      - name: Ruff
        run: |
          python -m ruff check .

      - name: Mypy
        run: |
          python -m mypy .

      - name: Tests with coverage
        run: |
          python -m pytest \
            --cov=vlm_engineering \
            --cov-report=term-missing

      - name: Dependency security audit
        run: |
          python -m pip_audit
name: Optional runtime compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU runtime without model weights
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.8,<3" "torchvision>=0.23,<1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[all,dev]"
      - name: Runtime imports and dependency checks
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          python -m pip check
          python - <<'PY'
          import torch, torchvision, transformers, sentence_transformers, qwen_vl_utils
          from transformers import AutoModelForMultimodalLM, AutoModelForImageTextToText
          from vlm_engineering import QwenVLEmbedder, QwenVLReranker, MultimodalRAGPipeline
          print(torch.__version__, torchvision.__version__, transformers.__version__, sentence_transformers.__version__)
          print(QwenVLEmbedder, QwenVLReranker, MultimodalRAGPipeline)
          PY
          python -m pytest -m "not real_model"
          python -m pip_audit
